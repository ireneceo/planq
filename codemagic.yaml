# PlanQ iOS — 클라우드 빌드 (Codemagic)
#
# 왜 클라우드인가: 우리 앱은 Remote URL 껍데기라(capacitor.config.ts) 서버 배포만으로 화면이 바뀐다.
#   → 앱 재빌드는 드물다. 그 도구 하나 때문에 맥에 Xcode(40GB)를 두지 않는다.
#   맥북 여유 28GB(2026-08-25 실측)라 애초에 설치도 빠듯했다.
#
# 안전장치: 목표 서버를 운영으로 고정하고 `ios-beta-check.js --expect-prod` 로 되짚는다.
#   기본값이 dev.planq.kr 이라(의도적 dev-first) 이 점검을 빼면 테스터 전원이 개발서버를 쓴다.
#
# 사전 준비 (Codemagic UI):
#   1) Teams > Integrations > App Store Connect 에 API 키 등록. 이름을 정확히 `PlanQ ASC` 로.
#   2) 이 저장소(github: ireneceo/planq) 연결
#   3) 환경변수 APP_STORE_APP_ID = App Store Connect 앱의 숫자 ID (선택 — 없으면 빌드번호 자동)

workflows:
  ios-testflight:
    name: PlanQ iOS — TestFlight (운영 planq.kr)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: PlanQ ASC
    environment:
      # 자동 서명(ios_signing) — Codemagic 에 저장된 인증서·프로파일을 빌드에 주입한다.
      #   ★ 전제: Codemagic UI 의 Code signing identities 에 아래 둘이 등록돼 있어야 한다.
      #     ① iOS certificates > Generate certificate (Codemagic 이 개인키를 만들어 보관)
      #     ② iOS provisioning profiles > Fetch profiles (애플 포털에서 만든 App Store 프로파일)
      #   2026-08-25 경위: 처음엔 자동 서명만 썼다가 "No matching profiles found" 로 실패했고
      #   (자동 서명은 가져오기만 하고 만들지는 않는다), CLI --create 로 우회했으나 인증서
      #   개인키를 UI 에 붙여넣어야 했다. 터미널 복사가 줄마다 공백을 붙여 키가 깨졌다.
      #   → 결론: 키를 사람 손으로 옮기지 않는다. Codemagic 이 만들어 보관하게 한다.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.planq
      vars:
        XCODE_WORKSPACE: "dev-frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.planq"
        # App Store Connect 의 앱 숫자 ID (2026-08-25 첫 업로드로 확인).
        #   있으면 빌드번호를 TestFlight 최신 +1 로 자동 증가시킨다.
        APP_STORE_APP_ID: "6804790919"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 의존성 설치 (Podfile 이 node_modules 경로를 참조한다)
        script: |
          cd dev-frontend
          npm ci
      - name: Capacitor sync — 운영 서버로 고정 + 목표 점검
        script: |
          cd dev-frontend
          npm run cap:beta      # CAP_SERVER_URL=https://planq.kr cap sync ios && ios-beta-check --expect-prod
      - name: pod install
        script: |
          cd dev-frontend/ios/App
          pod install
      - name: 빌드 번호 (TestFlight 최신 +1)
        script: |
          cd dev-frontend/ios/App
          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
            agvtool new-version -all $(($LATEST + 1))
          else
            agvtool new-version -all $BUILD_NUMBER
          fi
      - name: 서명 프로파일 적용
        script: xcode-project use-profiles
      - name: 아카이브 (IPA)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - irene@irenewp.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # ★ false 여도 빌드는 TestFlight 에 올라간다 — 내부 테스터는 심사 없이 즉시 설치 가능.
        #   true 는 "외부 테스터용 베타 심사 제출" 이라 Beta App Review 정보(피드백 이메일·
        #   담당자 이름·전화·이메일)가 채워져 있지 않으면 후처리가 실패한다(2026-08-25 실측:
        #   업로드·처리까지 다 끝난 뒤 이 단계에서만 빨간불 → 성공을 실패로 오독하기 쉽다).
        #   외부 테스터로 넓힐 때 test-info 를 채우고 true 로 되돌린다.
        submit_to_testflight: false
        # beta_groups:
        #   - PlanQ 내부

  # ─────────────────────────────────────────────────────────────────────
  # PlanQ Android — Google Play (운영 planq.kr)
  #
  # 사전 준비 (Codemagic UI):
  #   1) Teams > Integrations > Google Play 에 서비스 계정 JSON 등록 → 이름 `PlanQ Play`
  #   2) Code signing identities > Android keystores 에 업로드 키 등록 → reference `planq_upload`
  #      (Codemagic 이 만들어 보관하게 한다. iOS 에서 키를 손으로 옮기다 깨진 전례가 있다.)
  #   3) 첫 회차는 Play Console 에 **손으로 한 번** 올려야 한다 — 앱이 아직 없으면 API 업로드가
  #      거부된다. 그래서 아래 publishing 은 처음엔 주석 상태로 두고 artifacts 로 받는다.
  # ─────────────────────────────────────────────────────────────────────
  android-play:
    name: PlanQ Android — Play (운영 planq.kr)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - planq_upload
      vars:
        PACKAGE_NAME: "app.planq"
      node: 20
      java: 21
    scripts:
      - name: 의존성 설치
        script: |
          cd dev-frontend
          npm ci
      - name: Capacitor sync — 운영 서버로 고정 + 목표 점검
        script: |
          cd dev-frontend
          CAP_SERVER_URL=https://planq.kr npx cap sync android
          # ★ 이 점검이 없으면 테스터 전원이 개발 서버를 쓴다. 생성물은 gitignore 라
          #   코드 리뷰로도 안 걸린다 — 빌드 시점에만 잡을 수 있다.
          node ../scripts/android-beta-check.js --expect-prod
      - name: 빌드 번호 (Play 최신 +1)
        script: |
          cd dev-frontend/android
          # Play 는 같은 versionCode 재업로드를 거부한다. 이미 올라간 것보다 1 크게 잡는다.
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "versionCode → $NEXT"
          sed -i "s/versionCode .*/versionCode $NEXT/" app/build.gradle
      - name: AAB 빌드
        script: |
          cd dev-frontend/android
          ./gradlew bundleRelease
      - name: 서명 확인 — 서명 없는 AAB 는 Play 가 거부한다
        script: |
          # build.gradle 에 signingConfig 가 없거나 키스토어가 안 붙으면 Gradle 은
          # 아무 말 없이 **서명 없는 AAB** 를 내놓는다. 빌드는 초록불이고 거절은
          # 며칠 뒤 Play Console 에서 처음 알게 된다. 여기서 즉시 세운다.
          set -e
          cd dev-frontend/android
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "검사 대상: $AAB"
          if jarsigner -verify "$AAB" | grep -q "jar verified"; then
            echo "OK — 서명됨"
          else
            echo "FAIL — AAB 가 서명되지 않았습니다."
            echo "  확인: Codemagic 키스토어 reference 'planq_upload' 등록 여부"
            echo "  확인: dev-frontend/android/app/build.gradle 의 signingConfigs.release"
            jarsigner -verify "$AAB" | head -5
            exit 1
          fi
    artifacts:
      - dev-frontend/android/app/build/outputs/**/*.aab
      - dev-frontend/android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - irene@irenewp.com
        notify:
          success: true
          failure: true
      # 첫 업로드를 Play Console 에 손으로 마친 뒤 아래 주석을 해제한다.
      #   track 은 internal → closed(비공개) → open(공개) 순으로 넓힌다.
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT
      #   track: internal
      #   submit_as_draft: true
