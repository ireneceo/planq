# AI 에이전트 연동(#439) — ChatGPT·Claude 가 PlanQ MCP 서버(:3005)에 닿는 두 경로.
#   dev.planq.kr / planq.kr 서버 블록 안에서 `include` 한다(location /api/ 보다 앞).
#   설계 docs/AI_AGENT_INTEGRATION_DESIGN.md · CLAUDE.md «AI 에이전트 연동» 절.
location /agent/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # MCP 스트리밍 응답(SSE)
    proxy_read_timeout 300s;
}
location /.well-known/oauth- {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
