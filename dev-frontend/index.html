<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget 기본값(resizes-visual) 사용 — 키보드 up 시 레이아웃 뷰포트(innerHeight)는
         유지되고 visual viewport 만 줄어듦. iOS PWA standalone 에서 resizes-content 는 innerHeight 자체를
         줄이고 document 를 키보드 높이만큼 phantom scroll 시켜(실측 VVDIAG: iH 793→417, off/sY=376)
         position:fixed 레이아웃이 위로 밀리고 아래 흰 여백 → 입력란이 화면 위로 사라지는 회귀 유발.
         #root/body 를 --vvh(visualViewport.height)로 사이징하므로 resizes-content 불필요. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14B8A6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PlanQ" />
    <meta name="application-name" content="PlanQ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      사이클 N+17 — Google Fonts weight 축소.
      실 사용: 700 (525곳), 600 (651곳), 500 (202곳), 400 (19곳).
      거의 안 쓰는 200/300/800/900 제거 → 폰트 파일 fetch 19개 → 12개 (약 35% 감소).
      Outfit 은 Landing 페이지에서만 사용하지만 적은 weight 라 그대로 둠 (다음 사이클 lazy 검토).
      display=swap: 폰트 다운로드 동안 fallback 표시 → FOIT 차단, FCP 향상.
    -->
    <!-- ★ 2026-10-22 폰트 시트는 font-loader.js 가 건다 — 웹은 종전대로(그리기 차단 링크), 앱·설치형은 비차단.
         새로 깐 앱에서 이 시트(구글 서버 첫 연결)가 다 올 때까지 화면이 한 픽셀도 안 그려져 «멈춤» 으로 보였다
         (느린 망 흉내 실측: 첫 그림 3.99초 = 이 시트 도착 3.91초 직후). display=swap 이라 늦게 와도 글자는 먼저 보인다.
         주소를 바꾸면 font-loader.js 의 주소도 같이 바꾼다. -->
    <script src="/font-loader.js"></script>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <title>PlanQ — 일을 일답게 하다</title>
    <!-- 기본 메타 (SEO + SNS 카드) — 공유 페이지의 동적 OG 는 backend SSR 라우트가 별도 처리 (운영 nginx 가 /public/* 을 backend 로 proxy 할 때) -->
    <meta name="description" content="PlanQ는 업무, 프로젝트, 일정 등 기업의 업무 운영을 하나의 공간에서 관리할 수 있는 비즈니스 업무관리 및 협업 플랫폼입니다. Google Calendar를 연결하면 PlanQ의 일정과 Google Calendar 일정을 연동하여 관리할 수 있습니다. | PlanQ is a business management and collaboration platform that helps teams manage work, projects, schedules, and business operations in one place, with Google Calendar sync." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlanQ" />
    <meta property="og:title" content="PlanQ — 일이 일이 되지 않게" />
    <meta property="og:description" content="업무, 프로젝트, 일정 등 기업의 업무 운영을 하나의 공간에서 관리하는 비즈니스 업무관리 및 협업 플랫폼. Google Calendar 연동을 지원합니다." />
    <!-- 사이클 N+23: OG 썸네일 1200×630 (SNS 표준). icon-512 정사각형 → 슬로건 박힌 og-default.png.
         페이지별 OG 는 backend ogMetaMiddleware 가 share bot UA 감지 시 동적 교체. -->
    <meta property="og:image" content="https://planq.kr/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://planq.kr" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlanQ — 일이 일이 되지 않게" />
    <meta name="twitter:description" content="업무, 프로젝트, 일정 등 기업의 업무 운영을 하나의 공간에서 관리하는 비즈니스 업무관리 및 협업 플랫폼. Google Calendar 연동을 지원합니다." />
    <meta name="twitter:image" content="https://planq.kr/og-default.png" />
    <!-- 2026-09-21 SEO — 홈의 대표 주소·언어. 다른 공개 페이지(/features/ 등)는 운영에서 seoArtifacts 가
         이 파일을 틀로 페이지별 머리를 넣어 따로 만든다(public/seo-pages.json). 이 파일은 워크스페이스
         화면의 공통 틀이기도 하므로 홈 전용 본문은 noscript 에만 둔다(사람 화면에는 안 그려진다). -->
    <!-- 네이버 서치어드바이저 소유확인 (2026-09-21) — 지우면 네이버가 사이트 소유를 다시 확인할 때 실패한다 -->
    <meta name="naver-site-verification" content="e7b0e4c8703a0ffe60605e42c00cec6b791cba67" />
    <link rel="canonical" href="https://planq.kr/" />
    <link rel="alternate" type="application/rss+xml" title="PlanQ 인사이트" href="https://planq.kr/rss.xml" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <script type="application/ld+json">[{"@context": "https://schema.org", "@type": "Organization", "name": "PlanQ", "url": "https://planq.kr", "logo": "https://planq.kr/icon-512.png"}, {"@context": "https://schema.org", "@type": "WebSite", "name": "PlanQ", "url": "https://planq.kr", "inLanguage": "ko"}, {"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "PlanQ", "applicationCategory": "BusinessApplication", "operatingSystem": "Web, iOS, Android", "url": "https://planq.kr", "description": "업무, 프로젝트, 일정 등 기업의 업무 운영을 하나의 공간에서 관리하는 비즈니스 업무관리 및 협업 플랫폼. Google Calendar 연동을 지원합니다.", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "KRW", "description": "14일 무료 체험"}}]</script>
  </head>
  <body>
    <!-- 자바스크립트를 실행하지 않고 받아가는 클라이언트(검색·검수 도구 등)를 위한 최소 본문.
         화면에는 나오지 않는다 — 앱이 정상 로드되면 root 요소에 앱이 그려진다. -->
    <noscript>
      <h1>PlanQ</h1>
      <p>PlanQ는 업무, 프로젝트, 일정 등 기업의 업무 운영을 하나의 공간에서 관리할 수 있는 비즈니스 업무관리 및 협업 플랫폼입니다. Google Calendar를 연결하면 PlanQ의 일정과 Google Calendar 일정을 연동하여 관리할 수 있습니다.</p>
      <p>PlanQ is a business management and collaboration platform that helps teams manage work, projects, schedules, and business operations in one place. Users can connect Google Calendar to synchronize their schedules between PlanQ and Google Calendar.</p>
      <nav><a href="/features/">기능</a> · <a href="/pricing/">요금제</a> · <a href="/service/">서비스</a> · <a href="/insights/">인사이트</a> · <a href="/guide/">도움말</a> · <a href="/about/">브랜드 스토리</a> · <a href="/contact/">문의하기</a> · <a href="/app/">앱 다운로드</a></nav>
      <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></p>
    </noscript>
    <div id="root"></div>
    <!-- 앱 첫 실행 «불러오는 중» 화면 (2026-10-22, Irene: "앱 다운로드 새로 한 사람이 앱 열면 잠깐 멈춰서 … 다시 열면 나와").
         새로 깐 앱은 캐시가 없어 첫 화면을 그리기 전에 파일 240여 개를 받는다 — 느린 망에서 10초 넘게 아무것도 없는 화면이라
         «멈췄다» 로 읽혔다(두 번째부터는 캐시라 바로 뜬다). 그래서 번들이 오기 **전에** 이 HTML 만으로 로고·도는 표시를 보인다.
         · 앱(네이티브 WebView)·설치형 PWA 에서만 켠다 — 웹 랜딩(검색용 본문이 root 에 있다)은 그대로.
         · 앱이 root 에 무언가 그리면 main.tsx(hideBootSplash)가 걷는다.
         · 15초가 지나도 안 걷히면 «연결이 느립니다 · 다시 시도» 를 보인다 — 앱을 지웠다 다시 깔지 않아도 되게. -->
    <div id="pq-boot" aria-hidden="true" style="display:none">
      <style>
        #pq-boot{position:fixed;inset:0;z-index:2147483000;background:#115E59;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;color:#CCFBF1;text-align:center;padding:24px}
        #pq-boot .lg{font-size:40px;font-weight:800;letter-spacing:-1px;color:#fff}
        #pq-boot .lg span{color:#5EEAD4}
        #pq-boot .sp{width:28px;height:28px;border:3px solid rgba(204,251,241,.25);border-top-color:#5EEAD4;border-radius:50%;animation:pqboot .8s linear infinite}
        #pq-boot .sl{display:none;font-size:14px;line-height:1.6}
        #pq-boot .sl button{margin-top:12px;padding:10px 22px;font-size:15px;font-weight:600;color:#115E59;background:#fff;border:0;border-radius:8px}
        #pq-boot.slow .sl{display:block}
        @keyframes pqboot{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){#pq-boot .sp{animation:none}}
      </style>
      <div class="lg">Plan<span>Q</span></div>
      <div class="sp"></div>
      <div class="sl"><div id="pq-boot-msg"></div><button type="button" id="pq-boot-retry"></button></div>
    </div>
    <!-- 인라인 스크립트는 CSP(script-src self)가 막는다 — 같은 출처 파일로 둔다 -->
    <script src="/boot-splash.js"></script>
    <!-- 구형 WebView 폴리필 — 모듈보다 먼저(classic script). public/legacy-polyfill.js 참조 -->
    <script src="/legacy-polyfill.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
